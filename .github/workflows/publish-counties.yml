name: publish-counties
# Daily drip release (owner 2026-10-26): add the next counties from state/county-queue.json, rebuild, run every gate,
# and only if all pass commit, deploy and gate the live pages. A failing gate stops the day's release; nothing ships.
# Manual runs default to a dry run (build + gates, no commit or deploy).
on:
  schedule:
    - cron: '0 15 * * *'   # 15:00 UTC daily
  workflow_dispatch:
    inputs:
      publish:
        description: 'Commit and deploy (false = dry run)'
        type: boolean
        default: false
      drill:
        description: 'Fire drill (proves a guard for real): fail = alert opens; idle = nothing-to-publish live check; rollback = a bad live page is rolled back, then today is redeployed'
        type: choice
        options: [none, fail, idle, rollback]
        default: none

permissions:
  contents: write
  issues: write
  actions: read

concurrency: publish-counties

jobs:
  publish:
    runs-on: ubuntu-26.04   # pinned 2026-10-29 (owner: nothing may change under the jobs)
    concurrency: { group: site-deploy }   # one deploy at a time across workflows (2026-10-30)
    timeout-minutes: 45   # a normal day takes ~4 min; the default is 6 hours of billed minutes on a hang
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }   # the rollback needs the previous release (HEAD~1); depth 1 broke it (drill 2026-10-30)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Drill fail (the alert step below must open an issue)
        if: inputs.drill == 'fail'
        run: |
          echo "DRILL - forced failure"; exit 1
      - name: Drill rollback (live must be put back, then today's release redeployed)
        if: inputs.drill == 'rollback'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # pass only if the rollback deployed AND its live check passed (2026-10-30: a failed rollback printed OK)
          DRILL_CORRUPT=1 bash tools/deploy_verified.sh 2>&1 | tee drill.log || true
          grep -q "ROLLBACK OK: previous release is live" drill.log || { echo "DRILL FAILED: rollback did not complete"; exit 1; }
          echo "DRILL OK: rollback completed"; git checkout HEAD -- dist && bash tools/deploy_verified.sh && echo "DRILL OK: today's release live again"
      - name: Cloudflare token expiry (a warning on the run page 30 days before deploys would stop)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          out=$(python -I tools/token_check.py); echo "$out"
          echo "$out" | grep RENEW | sed 's/^/::warning::/' || true   # a yellow note on the run page; no email (owner)
      - name: Add the next counties
        id: add
        run: |
          if [ -n "${{ inputs.drill }}" ] && [ "${{ inputs.drill }}" != none ]; then echo "none=1" >> "$GITHUB_OUTPUT"; echo "drill: nothing added"; exit 0; fi
          out=$(python -I tools/add_counties.py 20); echo "$out"   # owner 11-06: 20 a day, only counties with Keyword Planner searches (queue "kw" > 0)
          echo "msg=$out" >> "$GITHUB_OUTPUT"
          new=$(git diff -U0 tools/counties.json | grep -o '^+ *"geoid": "[0-9]*"' | grep -o '[0-9]\{5\}' | xargs)
          [ -n "$new" ] && { python -I tools/pull_mapstatus.py $new || echo "::warning::map status not pulled for $new; the monthly run fills it"; }   # audit 11-07: same-day FEMA map facts
          # queue empty and the site already holds the latest data: nothing to build (a monthly refresh must still ship)
          if git diff --quiet tools/counties.json && [ "$(python -I tools/refresh_shipped.py)" = yes ]; then echo "queue empty"; echo "none=1" >> "$GITHUB_OUTPUT"; fi
      - name: Phone check browser
        if: steps.add.outputs.none != '1'
        run: |
          pip install -q playwright==1.64.1 pillow==12.2.0 && python -m playwright install --with-deps chromium webkit
          sudo apt-get install -y -q fonts-roboto fonts-noto-core fonts-noto-mono   # measure with a phone's fonts
          mkdir -p ~/.config/fontconfig && cp tools/ci-fonts.conf ~/.config/fontconfig/fonts.conf && fc-cache -f
          fc-match sans-serif; fc-match system-ui; fc-match serif   # proof in the log: must print Roboto / Noto Serif
      - name: Build and every release check (the same steps as a local release; 2026-10-28 it ran only three of them)
        if: steps.add.outputs.none != '1'
        run: python -I tools/test_tools.py --browser webkit && python -I tools/test_zonemap.py --browser webkit && python -I tools/test_ziptool.py --browser webkit && python -I tools/release.py
      - name: Commit, deploy, gate live
        if: steps.add.outputs.none != '1' && (github.event_name == 'schedule' || inputs.publish)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -A tools/counties.json places.json dist data/c data/states data/us/map_status.json state
          git diff --cached --quiet && { echo "nothing changed"; exit 0; }
          git commit -m "publish: ${{ steps.add.outputs.msg }}"
          git pull --rebase origin master && git push
          bash tools/deploy_verified.sh   # deploy; live must equal what passed, else the previous release goes back
          python -I tools/indexnow.py HEAD~1 || true   # tell Bing which pages changed (notice only)
      - name: Live site check on days with nothing to publish (queue empty; a lapsed domain or deleted site shows here)
        if: steps.add.outputs.none == '1' && inputs.drill != 'rollback' && inputs.drill != 'fail'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # live must equal the committed release; if not, deploy it again once (self-heal), then it must match
          python -I tools/gate_live.py || { npx --yes wrangler@4.86.0 deploy; sleep 30; python -I tools/gate_live.py; }
      - name: Alert on failure (one GitHub issue; GitHub emails the owner)
        if: failure() || cancelled()   # a timeout counts as cancelled
        env: { GH_TOKEN: "${{ github.token }}" }
        run: bash tools/job_alert.sh fail "publish-counties" refresh-data.yml 34
      - name: Close the alert when passing again; check the other job still runs
        if: success()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          bash tools/job_alert.sh ok "publish-counties" refresh-data.yml 34
          bash tools/job_alert.sh ok "deploy" - 0   # bot pushes never start deploy.yml, so a passed publish closes its alert
