name: publish-counties
# Daily drip release (owner 2026-10-26): add the next 10 counties from state/county-queue.json, rebuild, run every gate,
# and only if all pass commit, deploy and gate the live pages. A failing gate stops the day's release; nothing ships.
# Manual runs default to a dry run (build + gates, no commit or deploy).
on:
  schedule:
    - cron: '0 15 * * *'   # 15:00 UTC daily
  workflow_dispatch:
    inputs:
      publish:
        description: 'Commit and deploy (false = dry run)'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  actions: read

concurrency: publish-counties

jobs:
  publish:
    runs-on: ubuntu-26.04   # pinned 2026-10-29 (owner: nothing may change under the jobs)
    timeout-minutes: 45   # a normal day takes ~4 min; the default is 6 hours of billed minutes on a hang
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cloudflare token expiry (an alert issue 30 days before deploys would stop)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          out=$(python -I tools/token_check.py); echo "$out"
          r=$(echo "$out" | grep RENEW || true)
          [ -n "$r" ] && bash tools/job_alert.sh warn "Renew soon: Cloudflare API token" "$r. Make a new token in Cloudflare and paste it into GitHub repo Settings, Secrets, CLOUDFLARE_API_TOKEN." || true
      - name: Add the next 10 counties
        id: add
        run: |
          out=$(python -I tools/add_counties.py 20); echo "$out"
          echo "msg=$out" >> "$GITHUB_OUTPUT"
          git diff --quiet tools/counties.json && { echo "queue empty"; echo "none=1" >> "$GITHUB_OUTPUT"; } || true
      - name: Phone check browser
        if: steps.add.outputs.none != '1'
        run: pip install -q playwright==1.64.1 && python -m playwright install --with-deps chromium webkit
      - name: Build and every release check (the same steps as a local release; 2026-10-28 it ran only three of them)
        if: steps.add.outputs.none != '1'
        run: python -I tools/test_tools.py --browser webkit && python -I tools/release.py
      - name: Commit, deploy, gate live
        if: steps.add.outputs.none != '1' && (github.event_name == 'schedule' || inputs.publish)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -A tools/counties.json places.json dist data/c state
          git commit -m "publish: ${{ steps.add.outputs.msg }}"
          git pull --rebase origin master && git push
          npx --yes wrangler@4.86.0 deploy
          sleep 30
          python -I tools/gate_live.py
      - name: Alert on failure (one GitHub issue; GitHub emails the owner)
        if: failure()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: bash tools/job_alert.sh fail "publish-counties" refresh-data.yml 40
      - name: Close the alert when passing again; check the other job still runs
        if: success()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: bash tools/job_alert.sh ok "publish-counties" refresh-data.yml 40
