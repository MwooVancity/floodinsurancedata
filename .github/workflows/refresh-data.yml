name: refresh-data
# Owner 2026-10-28: "delete it all" off the laptop. The full FEMA download (every in-force policy and claim, ~250 MB)
# and the number crunching run here, not on the laptop. The raw files live in the Actions cache between runs; only the
# computed data/ files are committed. Nothing ships from here: a release still needs the gates and a hater review.
# Monthly (FEMA updates its files about monthly): pull_raw works out the as-of date itself (end of the month 3 months
# back); a new month = a new cache key = a fresh download; a rerun in the same month resumes. The daily publish job
# ships the new figures only through every gate.
on:
  schedule:
    - cron: '0 6 3 * *'   # 06:00 UTC on the 3rd of each month
  workflow_dispatch:
    inputs:
      jump_limit:
        description: 'Allowed move in one refresh, after a person looked at a held change (default 0.25)'
        default: '0.25'

permissions:
  contents: write
  issues: write
  actions: read

concurrency: refresh-data

jobs:
  refresh:
    runs-on: ubuntu-26.04   # pinned 2026-10-29 (owner: nothing may change under the jobs)
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: m
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4   # claims carry over month to month: only the last 3 loss years are re-pulled (pull_raw RECENT)
        with:
          path: .cache/raw/NfipClaims
          key: fema-claims-${{ steps.m.outputs.month }}
          restore-keys: fema-claims-
      - uses: actions/cache@v4   # policies: fresh every month (this cache only resumes a run within the month)
        with:
          path: |
            .cache/raw/NfipPolicies
            .cache/raw/asof.txt
          key: fema-pol-${{ steps.m.outputs.month }}
      - name: Download every FEMA policy and claim (resumable; skips finished slices)
        run: python -I tools/pull_raw.py && du -sh .cache/raw   # owner asked the download size
      # save now: a cache is otherwise saved only if the whole job passes, so a late failure re-downloaded 2 hours (2026-10-30)
      - uses: actions/cache/save@v4
        if: always()   # keep finished states even when one fails; .done markers are written only after counts match
        with:
          path: .cache/raw/NfipClaims
          key: fema-claims-${{ steps.m.outputs.month }}
      - uses: actions/cache/save@v4
        if: always()   # keep finished states even when one fails; .done markers are written only after counts match
        with:
          path: |
            .cache/raw/NfipPolicies
            .cache/raw/asof.txt
          key: fema-pol-${{ steps.m.outputs.month }}
      - name: Compute state, county and extras figures
        run: |
          set -e
          python -I tools/agg_raw.py
          python -I tools/extras_raw.py
          python -I tools/collect_state_small.py   # community discounts, disasters, aid, repeat floods, risk ratings (were collected once and never refreshed)
          # side sources: if one is down, last month's values stay (each carries its own date) and the refresh goes on
          python -I tools/fetch_map_dates.py || echo "::warning::FEMA map dates not refreshed this month"
          python -I tools/fetch_sealevel.py || echo "::warning::NOAA sea level not refreshed this month"
          python -I tools/jump_check.py --limit ${{ inputs.jump_limit || '0.25' }}   # a median moving >25% stops the commit: last month's data stays live
      - name: Commit the computed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -A data/states data/all-counties data/us data/c
          git diff --cached --quiet && { echo "no data change"; exit 0; }
          git commit -m "data: refresh from FEMA (policies as of $(cat .cache/raw/asof.txt))"
          git pull --rebase -X theirs origin master && git push   # others may push during the 2h run
      - name: Alert on failure (one GitHub issue; GitHub emails the owner)
        if: failure() || cancelled()   # a timeout counts as cancelled
        env: { GH_TOKEN: "${{ github.token }}" }
        run: bash tools/job_alert.sh fail "refresh-data" publish-counties.yml 3
      - name: Close the alert when passing again; check the other job still runs
        if: success()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: bash tools/job_alert.sh ok "refresh-data" publish-counties.yml 3
