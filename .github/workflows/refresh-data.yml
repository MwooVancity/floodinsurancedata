name: refresh-data
# Owner 2026-10-28: "delete it all" off the laptop. The FEMA download and the number crunching run here, not on the
# laptop; only the computed data/ files are committed. Nothing ships from here: the daily publish job ships the new
# figures only through every gate. FEMA updates every 40-60 days; refresh_plan.py downloads only when there is a new
# as-of month inside FEMA's file. The download is FEMA's two bulk files (pull_bulk.py, 8 min, every state's count equal
# to FEMA's and DC equal to the API field by field in the 2026-11-03 trial), not ~4,000 API pages (2 h, 503s): no cache.
on:
  schedule:
    # 06:00 UTC daily on the 3rd-10th: a dropped or late cron (2026-11-03), a FEMA outage or a late FEMA file is retried the
    # next day; refresh_plan makes a run after a good one a ~30 s no-op. Retries are days, not sleeps on a billed runner.
    - cron: '0 6 3-10 * *'
  workflow_dispatch:
    inputs:
      jump_limit:
        description: 'Allowed move in one refresh, after a person looked at a held change (default 0.25)'
        default: '0.25'

permissions:
  contents: write
  issues: write
  actions: read

concurrency: refresh-data

jobs:
  refresh:
    concurrency: { group: site-deploy }   # one writer on master at a time: publish shares it (11-03 critique: a late refresh's push raced the daily publish)
    runs-on: ubuntu-26.04   # pinned 2026-10-29 (owner: nothing may change under the jobs)
    timeout-minutes: 150   # bulk download 8 min + compute ~80 min + side sources 73 min on the 3rd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: plan   # skip the download when nothing is new (owner 2026-11-03)
        run: python -I tools/refresh_plan.py
      - name: Download FEMA's bulk policy and claim files, with every check (pull_bulk.py docstring)
        id: dl
        if: steps.plan.outputs.pull == 'true'
        # a failure here before the 10th sends no email: tomorrow's run downloads again (8 min)
        run: pip install -q pyarrow==21.0.0 && python -I tools/pull_bulk.py && du -sh .cache/raw   # owner asked the download size
      - name: Compute state, county and extras figures from the download
        if: steps.plan.outputs.pull == 'true'
        run: |
          set -e
          python -I tools/agg_raw.py
          python -I tools/extras_raw.py
      - name: Refresh the small sources
        id: side
        if: steps.plan.outputs.pull == 'true' || steps.plan.outputs.side == 'true'   # 73 min: not on every 3rd-10th retry (review 11-03)
        run: |
          set -e
          python -I tools/collect_state_small.py   # community discounts, disasters, aid, repeat floods, risk ratings (were collected once and never refreshed)
          # side sources: if one is down, last month's values stay (each carries its own date) and the refresh goes on
          python -I tools/fetch_map_dates.py || echo "::warning::FEMA map dates not refreshed this month"
          python -I tools/fetch_sealevel.py || echo "::warning::NOAA sea level not refreshed this month"
      - name: Jump check (own step, so a held change always emails; FEMA outages before the 10th do not)
        if: steps.plan.outputs.pull == 'true'
        run: python -I tools/jump_check.py --limit ${{ inputs.jump_limit || '0.25' }}   # a median moving >25% stops the commit: last month's data stays live
      - name: Commit the computed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -A data/states data/all-counties data/us data/c
          git diff --cached --quiet && { echo "no data change"; exit 0; }
          git commit -m "data: refresh from FEMA (policies as of $(python -I -c "import json;print(json.load(open('data/us/asof.json'))['asof'])"))"
          git pull --rebase -X theirs origin master && git push   # others may push during the 2h run
      - name: Alert on failure (one GitHub issue per problem; GitHub emails the owner once)
        if: failure() || cancelled()   # a timeout counts as cancelled
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          # FEMA unreachable before the 10th: no email, tomorrow's run resumes (owner 2026-11-03: one email per real problem)
          if [ "$(date -u +%-d)" -lt 10 ] && { [ "${{ steps.plan.outcome }}" = failure ] || [ "${{ steps.dl.outcome }}" = failure ] || [ "${{ steps.side.outcome }}" = failure ]; }; then
            echo "::warning::FEMA did not answer; tomorrow's run retries"; exit 0; fi
          bash tools/job_alert.sh fail "refresh-data" publish-counties.yml 3
      - name: Close the alert when passing again; check the other job still runs
        if: success()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: bash tools/job_alert.sh ok "refresh-data" publish-counties.yml 3
