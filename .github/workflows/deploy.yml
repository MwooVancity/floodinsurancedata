name: deploy
# Auto-deploy the committed dist/ to Cloudflare on every push to master (backup + rollback via git),
# and run the correctness gate on pull requests. No FEMA re-pull in CI — it deploys the built output,
# so a flaky API can never block a deploy. (Unverified until the first Actions run.)
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04   # pinned 2026-10-29 (owner: nothing may change under the jobs)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run the correctness gate on every built county page
        run: |
          set -e
          for d in data/c/*/; do   # county data lives in data/c/<slug> since 2026-10-27
            slug=$(basename "$d")
            page="dist/flood-insurance/$slug/index.html"
            [ -f "$d/agg.json" ] && [ -f "$page" ] || continue
            python -I tools/gate.py "$d/agg.json" "$page"
          done
      - name: Unit tests and the gate mutation suite (each check proven by a reintroduced bug)
        run: |
          set -e
          python -I tools/test_calc.py
          python -I tools/test_gate.py

  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04   # pinned 2026-10-29 (owner: nothing may change under the jobs)
    timeout-minutes: 10
    # two deploys could finish out of order and put an older site live (seen 2026-10-30): one deploy at a time across
    # workflows (publish-counties shares the group), and always the LATEST master, never the commit that triggered it
    concurrency: { group: site-deploy }
    permissions: { contents: read, issues: write }
    steps:
      - uses: actions/checkout@v4
        with: { ref: master }
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Deploy committed dist/ to Cloudflare
        run: npx --yes wrangler@4.86.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Alert on failure (one GitHub issue; GitHub emails the owner)
        if: failure()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: bash tools/job_alert.sh fail "deploy" - 0
