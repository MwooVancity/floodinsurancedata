name: deploy
# Deploy the committed dist/ to Cloudflare when a push changes the site (99 of 144 commits changed none of it).
on:
  workflow_dispatch:   # 11-11: a push run stuck queued for 4 h; a manual run (or a newer push) replaces it in the group
  push:
    branches: [master]
    paths: ['dist/**', 'wrangler.jsonc', '.github/workflows/deploy.yml']

jobs:
  deploy:
    runs-on: ubuntu-26.04   # pinned 2026-10-29 (owner: nothing may change under the jobs)
    timeout-minutes: 10
    # two deploys could finish out of order and put an older site live (seen 2026-10-30): one deploy at a time across
    # workflows (publish-counties shares the group), and always the LATEST master, never the commit that triggered it
    concurrency: { group: site-deploy }
    permissions: { contents: read, issues: write }
    steps:
      - uses: actions/checkout@v4
        with: { ref: master }
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Deploy committed dist/ to Cloudflare
        run: npx --yes wrangler@4.86.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Alert on failure (one GitHub issue; GitHub emails the owner)
        if: failure() || cancelled()   # a timeout counts as cancelled
        env: { GH_TOKEN: "${{ github.token }}" }
        run: bash tools/job_alert.sh fail "deploy" - 0
      - name: Close the deploy alert when a deploy passes again
        if: success()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: bash tools/job_alert.sh ok "deploy" - 0
