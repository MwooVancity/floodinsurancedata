name: fema-probe
# Hand-run only: what FEMA's NFHL map service offers from a US runner (fields, sample stats). No alert, no deploy.
on: workflow_dispatch
jobs:
  live-tool:   # Batch E gate: the live address tool vs real FEMA + Census, Chromium and WebKit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q playwright==1.64.1 && python -m playwright install --with-deps chromium webkit
      - run: python -I tools/live_zonemap.py --browser chromium
      - run: python -I tools/live_zonemap.py --browser webkit
  depts:   # 11-08: 12 state regulators refuse the laptop (bot walls); read them from a US runner, keep only title-checked pages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -I tools/fetch_insurance_depts.py && python3 -c "import json;d=json.load(open('data/us/insurance_depts.json'));print(len(d),'kept');[print(k,d.get(k)) for k in 'AK AZ KS LA MA MI MN NH NJ RI WV WY'.split()]"
      - uses: actions/upload-artifact@v4
        with: { name: insurance-depts, path: data/us/insurance_depts.json }
  links:   # 11-07: FEMA hosts refuse the laptop; check reader-facing FEMA links (status, title, key words) from a US runner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          for u in https://hazards.fema.gov/femaportal/onlinelomc/signin https://hazards.fema.gov/femaportal/prelimdownload/ \
                   https://www.fema.gov/flood-maps/change-your-flood-zone/loma-lomr-f https://www.fema.gov/flood-maps/tools-resources/flood-map-products/preliminary-flood-hazard-data \
                   https://www.fema.gov/flood-maps/change-your-flood-zone; do
            echo "== $u"; curl -sL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -o p.html -w "%{http_code} %{url_effective}\n" "$u"
            python3 -c "import re,html;t=open('p.html',errors='ignore').read();print('title:',(re.search(r'<title>(.*?)</title>',t,re.S) or [0,''])[1].strip()[:120]);t=re.sub(r'\s+',' ',html.unescape(re.sub(r'<[^>]+>',' ',re.sub(r'(?s)<(script|style).*?</\1>','',t))));[print('  ['+k+']',t[max(0,t.find(k)-160):t.find(k)+220]) for k in ('fee','Online LOMC','preliminary','Preliminary','elevation certificate','Elevation Certificate') if k in t]"
          done
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          B="https://hazards.fema.gov/arcgis/rest/services/public/NFHL/MapServer"
          # 11-08 audit D5: does a point + distance=15 m query work (a true circle, not the 21 m-corner square)?
          for P in "-80.0533,26.7153" "-95.3698,29.7604" "-90.0715,29.9511"; do
            echo "== D5 $P point"; curl -s -G "$B/28/query" --data-urlencode "geometry=$P" -d geometryType=esriGeometryPoint -d inSR=4326 -d outFields=FLD_ZONE,ZONE_SUBTY -d returnGeometry=false -d f=json | head -c 300; echo
            echo "== D5 $P distance 15 m"; curl -s -G "$B/28/query" --data-urlencode "geometry=$P" -d geometryType=esriGeometryPoint -d inSR=4326 -d distance=15 -d units=esriSRUnit_Meter -d outFields=FLD_ZONE,ZONE_SUBTY -d returnGeometry=false -d f=json | head -c 400; echo
            echo "== D3 $P LOMR layer 1 within 15 m"; curl -s -G "$B/1/query" --data-urlencode "geometry=$P" -d geometryType=esriGeometryPoint -d inSR=4326 -d distance=15 -d units=esriSRUnit_Meter -d outFields=* -d returnGeometry=false -d f=json | head -c 700; echo
            echo "== D3 $P LOMA layer 34 within 150 m"; curl -s -G "$B/34/query" --data-urlencode "geometry=$P" -d geometryType=esriGeometryPoint -d inSR=4326 -d distance=150 -d units=esriSRUnit_Meter -d outFields=* -d returnGeometry=false -d f=json | head -c 900; echo
          done
          # D6: time of one export image and one query (a map view pulls ~6-12 export images)
          for i in 1 2 3; do curl -s -o /dev/null -w "export %{http_code} %{time_total}s %{size_download}B\n" "$B/export?bbox=-8912000,3091000,-8911000,3092000&bboxSR=3857&imageSR=3857&size=256,256&layers=show:28&transparent=true&format=png32&f=image"; done
          for i in 1 2 3; do curl -s -o /dev/null -w "query %{http_code} %{time_total}s\n" -G "$B/28/query" --data-urlencode "geometry=-80.0533,26.7153" -d geometryType=esriGeometryPoint -d inSR=4326 -d outFields=FLD_ZONE -d returnGeometry=false -d f=json; done
          echo "== layer 28 FLD_ZONE domain"; curl -s "$B/28?f=json" | python3 -c "import json,sys;d=json.load(sys.stdin);[print(f['name'],f.get('domain')) for f in d.get('fields') or [] if f['name'] in ('FLD_ZONE','ZONE_SUBTY')]"
          B="https://hazards.fema.gov/arcgis/rest/services/public/NFHL/MapServer"
          for L in 3 1 34 0; do echo "== layer $L fields"; curl -s "$B/$L?f=json" | python3 -c "import json,sys;d=json.load(sys.stdin);print(d.get('name'),[f['name'] for f in d.get('fields') or []])"; done
          for L in 3 1 34; do echo "== layer $L sample for 12099C"; curl -s -G "$B/$L/query" --data-urlencode "where=DFIRM_ID='12099C'" --data-urlencode "outFields=*" --data-urlencode "returnGeometry=false" --data-urlencode "resultRecordCount=2" --data-urlencode "f=json" | head -c 900; echo; done
          echo "== layer 3 panel dates, Palm Beach"; curl -s -G "$B/3/query" --data-urlencode "where=DFIRM_ID='12099C'" --data-urlencode 'outStatistics=[{"statisticType":"min","onStatisticField":"EFF_DATE","outStatisticFieldName":"oldest"},{"statisticType":"max","onStatisticField":"EFF_DATE","outStatisticFieldName":"newest"},{"statisticType":"count","onStatisticField":"OBJECTID","outStatisticFieldName":"n"}]' --data-urlencode "f=json" | head -c 600; echo
          echo "== legend"; curl -s "$B/legend?f=json" | python3 -c "import json,sys;d=json.load(sys.stdin);l=[x for x in d['layers'] if x['layerId']==28][0];[print(x['label'],len(x.get('imageData',''))) for x in l['legend']]"
          echo "== census geocoder CORS"; curl -s -D - -o /dev/null -H "Origin: https://floodinsurancedata.com" "https://geocoding.geo.census.gov/geocoder/locations/onelineaddress?address=315%20Court%20St%2C%20Clearwater%2C%20FL&benchmark=Public_AR_Current&format=json" | grep -i -E "access-control|HTTP/"
          echo "== msc address link"; curl -s "https://msc.fema.gov/portal/search?AddressQuery=315%20Court%20St%2C%20Clearwater%2C%20FL%2033756" | grep -o -i "addressquery[^\"']\{0,80\}" | head -3
  prelim:   # 11-09 top-3 compare: FEMA preliminary (draft) and pending map status per county DFIRM
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: |
          P="https://hazards.fema.gov/arcgis/rest/services/PrelimPending/Prelim_NFHL/MapServer"
          Q="https://hazards.fema.gov/arcgis/rest/services/PrelimPending/Pending_NFHL/MapServer"
          ST='[{"statisticType":"count","onStatisticField":"OBJECTID","outStatisticFieldName":"n"},{"statisticType":"min","onStatisticField":"PRELM_ISSUE_DATE","outStatisticFieldName":"first"},{"statisticType":"max","onStatisticField":"PRELM_ISSUE_DATE","outStatisticFieldName":"last"}]'
          SE='[{"statisticType":"count","onStatisticField":"OBJECTID","outStatisticFieldName":"n"},{"statisticType":"min","onStatisticField":"EFF_DATE","outStatisticFieldName":"first"},{"statisticType":"max","onStatisticField":"EFF_DATE","outStatisticFieldName":"last"}]'
          for D in 48201C 12099C 17031C 12103C; do
            for L in 0 1; do echo "== prelim L$L $D"; curl -s -m 60 -G "$P/$L/query" --data-urlencode "where=DFIRM_ID LIKE '${D}%'" --data-urlencode "outStatistics=$ST" --data-urlencode "f=json" | head -c 400; echo; done
            echo "== prelim L1 $D sample"; curl -s -m 60 -G "$P/1/query" --data-urlencode "where=DFIRM_ID LIKE '${D}%'" --data-urlencode "outFields=DFIRM_ID,FIRM_PAN,PANEL_TYP,PRELM_ISSUE_DATE,PRELM_CODE,PNP_REASON" --data-urlencode "returnGeometry=false" --data-urlencode "resultRecordCount=3" --data-urlencode "f=json" | head -c 900; echo
            echo "== pending L1 $D"; curl -s -m 60 -G "$Q/1/query" --data-urlencode "where=DFIRM_ID LIKE '${D}%'" --data-urlencode "outStatistics=$SE" --data-urlencode "f=json" | head -c 400; echo
          done
          echo "== prelim L1 by DFIRM (all US)"; curl -s -m 120 -G "$P/1/query" --data-urlencode "where=1=1" --data-urlencode "groupByFieldsForStatistics=DFIRM_ID" --data-urlencode "outStatistics=$ST" --data-urlencode "f=json" | python3 -c "import json,sys;d=json.load(sys.stdin);f=[x['attributes'] for x in d.get('features',[])];print(len(f),'dfirms', sum(1 for a in f if str(a['DFIRM_ID']).endswith('C')),'end in C');[print(a) for a in f[:25]];print(d.get('error'),d.get('exceededTransferLimit'))"
          echo "== pending L1 by DFIRM (all US)"; curl -s -m 120 -G "$Q/1/query" --data-urlencode "where=1=1" --data-urlencode "groupByFieldsForStatistics=DFIRM_ID" --data-urlencode "outStatistics=$SE" --data-urlencode "f=json" | python3 -c "import json,sys;d=json.load(sys.stdin);f=[x['attributes'] for x in d.get('features',[])];print(len(f),'dfirms');[print(a) for a in f[:25]];print(d.get('error'))"
          echo "== prelim L0 sample"; curl -s -m 60 -G "$P/0/query" --data-urlencode "where=1=1" --data-urlencode "outFields=DFIRM_ID,PRELM_CODE,PRELM_ISSUE_DATE,PRELM_UID" --data-urlencode "returnGeometry=false" --data-urlencode "resultRecordCount=5" --data-urlencode "f=json" | head -c 1200; echo
