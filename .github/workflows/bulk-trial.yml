name: bulk-trial
# One-time proof (owner 2026-11-03) that FEMA's bulk files give exactly what the API pull gives: tools/pull_bulk.py
# downloads both files, checks snapshot date, size, ETag, schema, unique ids, every state's count against FEMA's own
# count, and DC field by field against the API. Writes nothing to the repo or the site. Delete this file once
# refresh-data.yml uses pull_bulk.py.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trial:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q pyarrow==21.0.0
      - name: Bulk pull with every check
        run: |
          df -h . | tail -1; free -g | head -2
          /usr/bin/time -v python -I tools/pull_bulk.py 2>&1 | tee bulk.log | grep -vE "^\s+(Page|Volun|Invol|Swaps|File|Socket|Signals|Average|Exit|Percent|Minor|Major|System|User|Command)" | tail -40
          grep -q "ALL DONE (bulk)" bulk.log
          du -sh .cache/raw
