<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Phone check in the cloud renders with Android's fonts (2026-10-30: Ubuntu's default DejaVu is ~9% taller than
     what a phone shows and failed P4 on a page that passes on real devices). system-ui and sans-serif -> Roboto,
     serif -> Noto Serif, as on Android. Installed by publish-counties.yml before the phone check. -->
<fontconfig>
  <alias binding="strong"><family>sans-serif</family><prefer><family>Roboto</family></prefer></alias>
  <alias binding="strong"><family>system-ui</family><prefer><family>Roboto</family></prefer></alias>
  <alias binding="strong"><family>serif</family><prefer><family>Noto Serif</family></prefer></alias>
  <alias binding="strong"><family>monospace</family><prefer><family>Noto Sans Mono</family></prefer></alias>
</fontconfig>
